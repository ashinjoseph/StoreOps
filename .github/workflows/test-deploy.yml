name: Push to Test Apps Script

on:
  push:
    branches: [claude/branch-divergence-merge-analysis-p4lsfm]
  workflow_dispatch:

jobs:
  push-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install clasp
        run: npm install -g @google/clasp

      - name: Setup clasp credentials
        run: |
          echo '${{ secrets.CLASPRC_JSON }}' > ~/.clasprc.json
          echo '{"scriptId":"1vaGESdvFjkBns4WBF9f3dq7N7_zhQ44f2wTNsBdnKbAbgY_VjYw4Ilr8","rootDir":"src"}' > .clasp.json

      - name: Push to test Apps Script project
        run: clasp push --force
