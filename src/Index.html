      { id: 'closeMiscDebit', rest: '0' }, { id: 'closeCount', rest: '' },
    ];
    if (hasLotto) {
      moneyFields.push({ id: 'closeLotto', rest: String(lottoStart) });
      moneyFields.push({ id: 'closeLottoTopup', rest: '0' });
    }
    wireMoneyInputs(moneyFields);

    if (hasLotto) {
      // Only a real keystroke counts as "touched" — our own auto-fill writes
      // .value directly, which fires nothing.
      $('closeLottoTopup').addEventListener('input', () => { topupTouched = true; });
      $('closeLotto').addEventListener('input', () => { countTouched = true; });
    }

    const recalcOn = ['closeCash','closeMiscCash','closeCount'];
    if (hasLotto) recalcOn.push('closeLotto', 'closeLottoTopup');
    recalcOn.forEach(id => {
      // blur too: clearing a field on focus and tabbing away restores the
      // resting value without firing `input`.
      $(id).addEventListener('input', recalcClose);
      $(id).addEventListener('blur', recalcClose);
    });
    if (hasLotto) recalcClose();   // paint the reserve row before any typing

    $('closeSubmit').onclick = async () => {
      const counted = parseFloat($('closeCount').value);
      if (isNaN(counted)) return toast('Enter the cash counted', 'error');
      // Mirrors the server rule — a reserve that isn't at the expected
      // balance needs a reason on the record. Server check is the real gate.
      if (hasLotto) {
        const lotto = parseFloat($('closeLotto').value) || 0;
        if (Math.abs(lotto - lottoExpected) > 0.01 && !$('closeLottoNote').value.trim()) {
          return toast('Lotto reserve isn’t ' + money(lottoExpected) + ' — add a reason', 'error');
        }
      }
      $('closeSubmit').disabled = true;
      $('closeSubmit').textContent = 'Closing…';
      try {
        const result = await call('rpcCloseShift', state.token, {
          sessionId,
          cashSales: parseFloat($('closeCash').value) || 0,
          creditCardSales: parseFloat($('closeCredit').value) || 0,
          debitCardSales: parseFloat($('closeDebit').value) || 0,
          // Cashback is retired — the field is gone from the form, but the
          // sales column stays for the historical rows that still hold it.
          cashbackPaid: 0,
          miscCashSales: parseFloat($('closeMiscCash').value) || 0,
          miscCreditSales: parseFloat($('closeMiscCredit').value) || 0,
          miscDebitSales: parseFloat($('closeMiscDebit').value) || 0,
          miscNotes: $('closeMiscNotes').value.trim(),
          physicalCount: counted,
          lottoCounted: hasLotto ? (parseFloat($('closeLotto').value) || 0) : null,
          lottoTopupFromTill: hasLotto ? lottoTopup() : 0,
          lottoNote: hasLotto ? $('closeLottoNote').value.trim() : '',
        });
        closeSheet();
        const variance = result && result.variance != null ? Number(result.variance) : 0;
        toast('✓ ' + company.toUpperCase() + ' closed · variance ' + money(variance),
              Math.abs(variance) > 30 ? 'warning' : 'success');
        loadShiftTab();
        // Async follow-up: when all tills are closed for the day, reconcile
        // against Clover + WhatsApp. Fire-and-forget — never affects the close.
        call('rpcReconcileDay', state.token, false).then(r => {
          if (r && r.ready && !r.empty) {
            toast((r.whatsapp && r.whatsapp.sent) ? '✓ Day reconciled — WhatsApp sent' : '✓ Day reconciled',
                  'success');
          }
        }).catch(() => {});
      } catch (e) {
        toast(e.message, 'error');
        $('closeSubmit').disabled = false;
        $('closeSubmit').textContent = 'Close shift';
      }
    };
  }

  function handleRpcError(e, viewEl) {
    if (e.message && e.message.indexOf('NOT_LOGGED_IN') !== -1) {
      toast('Session expired — please sign in again', 'warning');
      leaveApp();
      return;
    }
    if (viewEl) viewEl.innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div>' + esc(e.message) + '</div>';
    else toast(e.message, 'error');
  }

  // ============================================================
  //  ░░  TAB: SCHEDULE  ░░
  // ============================================================
  async function loadScheduleTab(force) {
    if (!state.weekStart) state.weekStart = mondayOf(new Date());
    const view = $('view-schedule');
    const args = [state.token, isoDate(state.weekStart)];
    if (force || !cacheFresh('rpcGetWeekSchedule', args, TTL_SEMI)) {
      view.innerHTML = '<div class="loading"><div class="spinner"></div>Loading schedule…</div>';
    }
    try {
      const data = await cachedCall('rpcGetWeekSchedule', args, TTL_SEMI, { force });
      renderScheduleTab(data);
    } catch (e) {
      handleRpcError(e, view);
    }
  }

  function renderScheduleTab(data) {
    const view = $('view-schedule');
    const ws = new Date(data.weekStart + 'T00:00:00');
    const we = new Date(data.weekEnd + 'T00:00:00');
    const wsLabel = ws.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
                    ' – ' + we.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
    const thisWeek = isoDate(mondayOf(new Date()));
    const isThisWeek = data.weekStart === thisWeek;

    let html = '<div class="week-nav">' +
      '<button class="week-nav-btn" id="weekPrev">‹</button>' +
      '<div style="text-align:center">' +
        '<div class="week-label">' + esc(wsLabel) + '</div>' +
        (isThisWeek ? '<div style="font-size:11px;color:#6a6e79;margin-top:2px;font-weight:500">This week</div>'
                    : '<div class="week-today-link" id="weekToday">Jump to this week</div>') +
      '</div>' +
      '<button class="week-nav-btn" id="weekNext">›</button>' +
    '</div>';

    if (data.staff.length === 0) {
      html += '<div class="empty"><div class="empty-icon">👥</div>No active staff. Add staff in the spreadsheet first.</div>';
      view.innerHTML = html;
      return;
    }

    // Grid: header row + one row per staff
    const cols = '110px repeat(7, 1fr)';
    html += '<div class="schedule-scroll"><div class="schedule-grid" style="grid-template-columns:' + cols + '">';
    html += '<div class="schedule-head schedule-staff-cell">Staff</div>';
    const todayStr = isoDate(new Date());
    data.days.forEach(d => {
      const isToday = d.date === todayStr;
      html += '<div class="schedule-head' + (isToday ? ' schedule-today' : '') + '">' + esc(d.dayName) +
              '<div style="font-size:10px;font-weight:500;color:#8a8e98">' + esc(d.date.slice(-2)) + '</div></div>';
    });
    data.staff.forEach(staff => {
      html += '<div class="schedule-staff-cell">' + esc(staff.name) + '</div>';
      data.days.forEach(d => {
        const cell = data.cells.find(c => c.staffId === staff.staffId && c.date === d.date);
        const isToday = d.date === todayStr;
        html += '<div class="schedule-cell' + (isToday ? ' schedule-today' : '') +
                '" data-staff-id="' + esc(staff.staffId) + '" data-date="' + esc(d.date) + '">';
        if (cell && cell.status) {
          html += '<div class="sched-status sched-' + esc(cell.status) + '">' + esc(cell.status.replace('_',' ')) + '</div>';
          if (cell.scheduledStart && cell.scheduledEnd) {
            html += '<div class="sched-time">' + esc(cell.scheduledStart) + '–' + esc(cell.scheduledEnd) + '</div>';
          } else if (cell.hoursWorked) {
            html += '<div class="sched-time">' + cell.hoursWorked.toFixed(2) + 'h</div>';
          }
          if (cell.scheduledHours > 0 && cell.actualHours > 0 &&
              Math.abs(cell.scheduledHours - cell.actualHours) >= 0.01) {
            if (cell.hoursBasis) {
              html += '<div class="sched-flag sched-flag-ok" title="Reviewed — hours set to ' +
                esc(cell.hoursBasis) + '">✓ ' + esc(cell.hoursBasis) + '</div>';
            } else {
              html += '<div class="sched-flag" title="Scheduled ' + cell.scheduledHours.toFixed(2) +
                'h vs worked ' + cell.actualHours.toFixed(2) + 'h — tap to adjust">⚠︎ sched≠worked</div>';
            }
          }
        } else {
          html += '<div class="sched-empty">—</div>';
        }
        html += '</div>';
      });
    });
    html += '</div></div>';

    const role = state.me.role;
    const canEdit = role === 'admin' || role === 'manager';
    if (canEdit) {
      html += '<div style="font-size:11px;color:#6a6e79;text-align:center;margin-top:10px">Tap any cell to schedule or edit</div>';
    }

    view.innerHTML = html;

    $('weekPrev').onclick = () => { haptic(); state.weekStart = addDays(state.weekStart, -7); loadScheduleTab(); };
    $('weekNext').onclick = () => { haptic(); state.weekStart = addDays(state.weekStart, 7); loadScheduleTab(); };
    const todayLink = $('weekToday');
    if (todayLink) todayLink.onclick = () => { haptic(); state.weekStart = mondayOf(new Date()); loadScheduleTab(); };

    if (canEdit) {
      view.querySelectorAll('.schedule-cell').forEach(cell => {
        cell.onclick = () => {
          haptic();
          editScheduleCell(cell.dataset.staffId, cell.dataset.date, data);
        };
      });
    }
  }

  function editScheduleCell(staffId, date, weekData) {
    const cell = weekData.cells.find(c => c.staffId === staffId && c.date === date);
    const staff = weekData.staff.find(s => s.staffId === staffId);
    const dateLabel = new Date(date + 'T00:00:00').toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });

    const canEditTimes = cell && cell.status === 'scheduled';
    const isPastWork = cell && (cell.status === 'in_progress' || cell.status === 'worked');

    let bodyHTML;
    if (isPastWork) {
      const canAdjust = state.me.role === 'admin' || state.me.role === 'manager';
      const sH = cell.scheduledHours || 0;
      const aH = cell.actualHours || 0;
      const mismatch = sH > 0 && aH > 0 && Math.abs(sH - aH) >= 0.01;
      bodyHTML =
        '<div style="font-size:13px;color:#4a4e59;line-height:1.6">' +
          '<div>Status: <strong>' + esc(cell.status) + '</strong></div>' +
          (cell.hoursWorked ? '<div>Recorded hours: <strong>' + cell.hoursWorked.toFixed(2) + 'h</strong></div>' : '') +
          (sH > 0 ? '<div>Scheduled: <strong>' + sH.toFixed(2) + 'h</strong></div>' : '') +
          (aH > 0 ? '<div>Actual (open→close): <strong>' + aH.toFixed(2) + 'h</strong></div>' : '') +
        '</div>';
      if (mismatch && canAdjust) {
        const reviewed = !!cell.hoursBasis;
        bodyHTML +=
          '<div style="margin-top:14px;padding:12px;background:' + (reviewed ? '#dcfce7' : '#fef3c7') + ';border-radius:9px;font-size:12px;color:' + (reviewed ? '#15803d' : '#92611a') + '">' +
            (reviewed ? '✓ Reviewed — recorded hours set to ' + esc(cell.hoursBasis) + '. Change to:'
                      : '⚠︎ Scheduled and actual hours differ. Set recorded hours to:') +
            '<div style="display:flex;gap:8px;margin-top:10px">' +
              '<button class="btn-primary" id="useSchedBtn" style="flex:1;padding:9px;font-size:12px;background:#1a4ca1">Scheduled ' + sH.toFixed(2) + 'h</button>' +
              '<button class="btn-primary" id="useActualBtn" style="flex:1;padding:9px;font-size:12px;background:#15803d">Actual ' + aH.toFixed(2) + 'h</button>' +
            '</div>' +
          '</div>';
      } else {
        bodyHTML +=
          '<div style="margin-top:14px;padding:12px;background:#f5f6f8;border-radius:9px;font-size:12px;color:#6a6e79">' +
            (mismatch ? 'Scheduled and actual hours differ — ask an admin/manager to adjust.'
                      : 'To correct the actual open/close times, use admin tools.') +
          '</div>';
      }
    } else {
      bodyHTML =
        '<div class="sheet-row">' +
          '<div class="sheet-field">' +
            '<label>Scheduled start</label>' +
            '<input type="text" id="schedStart" placeholder="09:00" value="' + esc(cell ? cell.scheduledStart : '') + '">' +
          '</div>' +
          '<div class="sheet-field">' +
            '<label>Scheduled end</label>' +
            '<input type="text" id="schedEnd" placeholder="17:00" value="' + esc(cell ? cell.scheduledEnd : '') + '">' +
          '</div>' +
        '</div>' +
        '<div style="font-size:11px;color:#6a6e79">Times like 09:00, 17:30. 24-hour format.</div>';
    }

    let actionsHTML;
    if (isPastWork) {
      actionsHTML = '<button class="sheet-cancel" onclick="closeSheet()">Close</button>';
    } else if (cell && cell.attendanceId) {
      // existing scheduled — allow edit or cancel
      actionsHTML =
        '<button class="sheet-cancel" id="cancelSchedBtn">Cancel shift</button>' +
        '<button class="sheet-submit" id="saveSchedBtn">Save</button>';
    } else {
      actionsHTML =
        '<button class="sheet-cancel" onclick="closeSheet()">Cancel</button>' +
        '<button class="sheet-submit" id="saveSchedBtn">Schedule</button>';
    }

    openSheet({
      title: esc(staff.name),
      subtitle: esc(dateLabel),
      bodyHTML, actionsHTML,
    });

    const saveBtn = $('saveSchedBtn');
    if (saveBtn) saveBtn.onclick = async () => {
      const start = $('schedStart').value.trim();
      const end = $('schedEnd').value.trim();
      saveBtn.disabled = true;
      saveBtn.textContent = 'Saving…';
      try {
        if (cell && cell.attendanceId) {
          // editing existing — call schedule which is idempotent only on missing rows.
          // For existing rows we just say "cancel + re-create".
          await call('rpcCancelScheduledShift', state.token, cell.attendanceId, 'Replaced');
        }
        if (start || end) {
          await call('rpcScheduleShift', state.token, { staffId, date, scheduledStart: start, scheduledEnd: end });
        }
        closeSheet();
        toast('✓ Saved', 'success');
        loadScheduleTab();
      } catch (e) {
        toast(e.message, 'error');
        saveBtn.disabled = false;
        saveBtn.textContent = 'Save';
      }
    };
    const cancelBtn = $('cancelSchedBtn');
    if (cancelBtn) cancelBtn.onclick = async () => {
      if (!confirm('Cancel this scheduled shift?')) return;
      cancelBtn.disabled = true;
      try {
        await call('rpcCancelScheduledShift', state.token, cell.attendanceId, 'Cancelled via UI');
        closeSheet();
        toast('✓ Shift cancelled', 'success');
        loadScheduleTab();
      } catch (e) {
        toast(e.message, 'error');
        cancelBtn.disabled = false;
      }
    };
    [['useSchedBtn', 'scheduled'], ['useActualBtn', 'actual']].forEach(([id, basis]) => {
      const b = $(id);
      if (!b) return;
      b.onclick = async () => {
        haptic();
        b.disabled = true;
        try {
          await call('rpcAdjustAttendanceHours', state.token, cell.attendanceId, basis);
          closeSheet();
          toast('✓ Hours set to ' + basis, 'success');
          loadScheduleTab();
        } catch (e) { toast(e.message, 'error'); b.disabled = false; }
      };
    });
  }

  // ============================================================
  //  ░░  TAB: MY PAY  ░░
  // ============================================================
  //  Self-service payroll view. Backend (rpcGetMyOwedSummary) scopes
  //  to session.staffId so any role can use this and only see their own
  //  pay. Designed to make the math obvious — shift value = hours × rate,
  //  bonuses/commissions itemized with the calculation in `reason`.
  // ============================================================
  async function loadMyPayTab(force) {
    const view = $('view-mypay');
    if (force || !cacheFresh('rpcGetMyOwedSummary', [state.token], TTL_SEMI)) {
      view.innerHTML = '<div class="loading"><div class="spinner"></div>Loading your pay…</div>';
    }
    try {
      const data = await cachedCall('rpcGetMyOwedSummary', [state.token], TTL_SEMI, { force });
      renderMyPayTab(data);
    } catch (e) {
      handleRpcError(e, view);
    }
  }

  function renderMyPayTab(data) {
    const view = $('view-mypay');
    if (!data) {
      view.innerHTML = '<div class="empty"><div class="empty-icon">💵</div>Could not load pay info.</div>';
      return;
    }

    let html = '';

    // ── Summary cards ────────────────────────────────
    html += '<div class="mypay-summary">' +
      '<div class="sales-total-card"><div class="sales-total-label">Hourly Rate</div><div class="sales-total-amount">' + money(data.hourlyRate) + '/hr</div></div>' +
      '<div class="sales-total-card"><div class="sales-total-label">Shifts Owed</div><div class="sales-total-amount">' + money(data.shiftsOwed) + '</div></div>' +
      '<div class="sales-total-card"><div class="sales-total-label">Bonuses Owed</div><div class="sales-total-amount">' + money(data.bonusesOwed) + '</div></div>' +
      '<div class="sales-total-card"><div class="sales-total-label">Total Owed</div><div class="sales-total-amount" style="color:#15803d">' + money(data.totalOwed) + '</div></div>' +
    '</div>';

    // ── Unpaid shifts breakdown ──────────────────────
    const shifts = data.unpaidShifts || [];
    html += '<div class="mypay-section-title">Unpaid shifts (' + shifts.length + ')</div>';
    if (shifts.length === 0) {
      html += '<div class="empty" style="padding:20px"><div class="empty-icon">✓</div>All worked shifts have been paid in full.</div>';
    } else {
      html += '<div class="mypay-table">';
      html += '<div class="mypay-row header">' +
        '<div>Date</div>' +
        '<div class="right">Hours</div>' +
        '<div class="right">Rate</div>' +
        '<div class="right">Value</div>' +
        '<div class="right">Paid</div>' +
        '<div class="right">Remaining</div>' +
      '</div>';
      shifts.forEach(s => {
        const isPartial = Number(s.paid || 0) > 0.005;
        html += '<div class="mypay-row' + (isPartial ? ' partial' : '') + '">' +
          '<div>' + esc(s.dateStr || fmtDate(s.date)) + '</div>' +
          '<div class="right">' + Number(s.hoursWorked || 0).toFixed(2) + 'h</div>' +
          '<div class="right">' + money(s.rate) + '</div>' +
          '<div class="right">' + money(s.value) + '</div>' +
          '<div class="right">' + money(s.paid) + '</div>' +
          '<div class="right"><strong>' + money(s.remaining) + '</strong></div>' +
        '</div>';
      });
      html += '</div>';
    }

    // ── Pending bonuses & commissions ────────────────
    const bonuses = data.pendingBonuses || [];
    html += '<div class="mypay-section-title">Pending bonuses & commissions (' + bonuses.length + ')</div>';
    if (bonuses.length === 0) {
      html += '<div class="empty" style="padding:20px"><div class="empty-icon">🎁</div>No pending bonuses or commissions.</div>';
    } else {
      bonuses.forEach(b => {
        const type = (b.type || 'bonus').toLowerCase();
        const badgeClass = type === 'commission' ? 'mypay-badge commission' : 'mypay-badge';
        const partialNote = Number(b.paid || 0) > 0.005
          ? ' · paid ' + money(b.paid) + ' so far'
          : '';
        html += '<div class="history-item">' +
          '<div class="history-head">' +
            '<div style="flex:1; min-width:0; padding-right:10px">' +
              '<div><span class="' + badgeClass + '">' + esc(type) + '</span>' +
                '<span style="font-weight:600">' + esc(b.reason || '—') + '</span>' +
              '</div>' +
              '<div class="history-meta">' +
                esc(b.dateStr || (b.date ? fmtDate(b.date) : '—')) +
                (b.company ? ' · ' + esc(b.company) : '') +
                partialNote +
              '</div>' +
            '</div>' +
            '<div class="history-amount">' + money(b.remaining) + '</div>' +
          '</div>' +
        '</div>';
      });
    }

    // ── Explainer ────────────────────────────────────
    html += '<div class="mypay-explainer">' +
      '<strong>How your pay is calculated:</strong> ' +
      'Each shift\'s value = <em>hours worked × your hourly rate at the time</em>. ' +
      'Your rate is snapshotted when a shift is completed, so old shifts keep their original rate even if your rate changes later. ' +
      'Bonuses and commissions are tracked separately and become payable once approved by an admin. ' +
      'When a payment is recorded, it is applied to your <strong>oldest unpaid shifts first</strong>.' +
    '</div>';

    view.innerHTML = html;
  }

  // ============================================================
  //  ░░  TAB: MORE  ░░
  // ============================================================
  //  Drawer that lists role-appropriate tools (Sales, Payroll,
  //  Commissions, etc.) as tappable cards. Selecting one calls
  //  switchTab(target) — the "More" bottom button stays highlighted

  // ============================================================

    renderMoreTab();

  function renderMoreTab() {

    if (items.length === 0) {

    }

    items.forEach(it => {
      html += '<div class="more-item" data-go="' + esc(it.tab) + '">' +
        '<div class="more-item-icon">' + it.icon + '</div>' +

          '<div class="more-item-title">' + esc(it.label) + '</div>' +

  // Render a small "← More" back link at the top of any drawer view.
  // Returns the HTML string; views call this and prepend it to their content.
  function moreBack() {
    return '<button class="more-back" onclick="switchTab(\'more\')">← More</button>';

  // ============================================================
  //  ░░  TAB: SHOPPING LIST  ░░
  // ============================================================
  //  Shared "to order" list. Anyone can add (catalog pick or new item);
  //  manager/payroll_admin/admin can Generate & send (formats text,
  //  clears pending, sends WhatsApp). Visible to everyone.
  // ============================================================
  async function loadShoppingTab(force) {
    const view = $('view-shopping');
    if (force || !cacheFresh('rpcGetShoppingList', [state.token], TTL_LIVE)) {
      view.innerHTML = '<div class="loading"><div class="spinner"></div>Loading list…</div>';
    }
    // Warm the product picker in the background (NOT at login — the catalog is
    // the heaviest read in the app and most sessions never open this tab). By
    // the time the list is read and "+ Add item" is tapped, it's a cache hit.
    cachedCall('rpcGetProductsForPicker', [state.token], TTL_REF).catch(() => {});
    try {
      const list = await cachedCall('rpcGetShoppingList', [state.token], TTL_LIVE, { force });
      renderShoppingTab(list);
    } catch (e) {
      handleRpcError(e, view);
    }
  }

  function renderShoppingTab(list) {
    const view = $('view-shopping');
    list = list || [];
    state.shoppingList = list;   // the picker seeds its quantities from this
    const privileged = ['admin', 'manager', 'payroll_admin'].indexOf(state.me.role) >= 0;
    const toBuy = list.filter(e => !e.bought).length;
    const doneCount = list.length - toBuy;

    let html = moreBack();

    // Action buttons: Add (all), then Generate + Clear (manager+).
    html += '<button class="btn-primary" id="addItemBtn" style="width:100%; padding:10px; font-size:13px; margin-bottom:8px">+ Add item</button>';
    if (privileged) {
      html += '<div style="display:flex; gap:8px; margin-bottom:12px">' +
        '<button class="btn-primary" id="genListBtn" style="flex:1; padding:10px; font-size:13px; background:#15803d"' +
          (toBuy === 0 ? ' disabled' : '') + '>Generate &amp; send</button>' +
        '<button class="btn-primary" id="clearListBtn" style="flex:1; padding:10px; font-size:13px; background:#b91c1c"' +
          (list.length === 0 ? ' disabled' : '') + '>Clear list</button>' +
      '</div>';
    }

    // Generated output (persists across reloads via state.lastGenerated)
    html += renderGeneratedOutputHTML_(state.lastGenerated);

    html += '<div class="mypay-section-title">To buy (' + toBuy + ')' +
      (doneCount > 0 ? ' · ' + doneCount + ' done' : '') + '</div>';
    if (list.length === 0) {
      html += '<div class="empty" style="padding:20px"><div class="empty-icon">🛒</div>Nothing on the list yet. Tap "+ Add item".</div>';
    } else {
      const cats = ['vape', 'cigarettes', 'beer', 'grocery', 'other'];
      list.forEach(e => { const c = (e.category || 'other'); if (cats.indexOf(c) === -1) cats.push(c); });
      cats.forEach(cat => {
        const inCat = list.filter(e => (e.category || 'other') === cat);
        if (inCat.length === 0) return;
        html += '<div class="recent-title" style="margin:10px 0 6px">' + esc(catLabel(cat)) + '</div>';
        inCat.forEach(e => {
          const canRemove = e.addedBy === state.me.staffId || privileged;
          html += '<div class="history-item shop-row">' +
            '<input type="checkbox" class="shop-check" data-bought="' + esc(e.entryId) + '"' + (e.bought ? ' checked' : '') + '>' +
            '<div class="shop-item">' +
              '<div class="history-name' + (e.bought ? ' shop-done' : '') + '">' + esc(e.itemName) +
                ' <span style="color:#6a6e79; font-weight:600">× ' + e.quantity + (e.unit ? ' ' + esc(e.unit) : '') + '</span></div>' +
              '<div class="history-meta">' + (e.note ? esc(e.note) + ' · ' : '') +
                'by ' + esc(e.addedByName || e.addedBy) + '</div>' +
            '</div>' +
            (canRemove ? '<button class="shop-edit" data-edit="' + esc(e.entryId) + '" title="Edit">✎</button>' : '') +
            (canRemove ? '<button class="shop-remove" data-remove="' + esc(e.entryId) + '" title="Remove">✕</button>' : '') +
          '</div>';
        });
      });
    }

    view.innerHTML = html;

    $('addItemBtn').onclick = () => { haptic(); openAddShoppingItem(); };
    const gen = $('genListBtn');
    if (gen) gen.onclick = () => { haptic(); generateShoppingList(); };
    const clr = $('clearListBtn');
    if (clr) clr.onclick = () => { haptic(); clearShoppingList(); };
    const copyBtn = $('copyGenBtn');
    if (copyBtn) copyBtn.onclick = copyGeneratedText_;
    const dismiss = view.querySelector('[data-dismiss-gen]');
    if (dismiss) dismiss.onclick = () => { state.lastGenerated = null; loadShoppingTab(); };

    view.querySelectorAll('[data-bought]').forEach(cb => {
      cb.onchange = async () => {
        haptic();
        cb.disabled = true;
        try {
          await call('rpcSetShoppingItemBought', state.token, cb.dataset.bought, cb.checked);
          loadShoppingTab();
        } catch (e) { toast(e.message, 'error'); cb.checked = !cb.checked; cb.disabled = false; }
      };
    });
    // Remove is instant with an Undo toast rather than a blocking confirm() —
    // a shopping list is cheap to get wrong, and the dialog was the slowest
    // part of clearing items on a phone. Undo re-adds from the product, so it
    // comes back with a new entryId attributed to whoever tapped Undo.
    view.querySelectorAll('[data-remove]').forEach(b => {
      b.onclick = async () => {
        haptic();
        b.disabled = true;
        const gone = list.find(x => x.entryId === b.dataset.remove);
        try {
          await call('rpcRemoveShoppingListEntry', state.token, b.dataset.remove);
          loadShoppingTab(true);
          toast('Removed ' + (gone ? gone.itemName : 'item'), 'warning',
            gone && gone.productId ? {
              label: 'Undo',
              onClick: async () => {
                try {
                  await call('rpcAddToShoppingList', state.token, {
                    productId: gone.productId, quantity: gone.quantity, note: gone.note || '',
                  });
                  toast('✓ Restored', 'success');
                } catch (e) { toast(e.message, 'error'); }
                loadShoppingTab(true);
              },
            } : null);
        } catch (e) { toast(e.message, 'error'); b.disabled = false; }
      };
    });
    view.querySelectorAll('[data-edit]').forEach(b => {
      b.onclick = () => { haptic(); openEditShoppingItem(list.find(x => x.entryId === b.dataset.edit)); };
    });
  }

  async function clearShoppingList() {
    if (!confirm('Clear the entire list and start fresh? This removes all items (bought and to-buy).')) return;
    const btn = $('clearListBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Clearing…'; }
    try {
      const res = await call('rpcClearShoppingList', state.token);
      state.lastGenerated = null;
      toast('Cleared ' + (res.cleared || 0) + ' item(s)', 'warning');
      loadShoppingTab();
    } catch (e) {
      toast(e.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Clear list'; }
    }
  }

  function renderGeneratedOutputHTML_(result) {
    if (!result || !result.text) return '';
    const wa = result.whatsapp || {};
    const waLine = wa.sent
      ? '<div style="color:#15803d; font-size:12px; font-weight:600; margin-top:6px">✓ Sent via WhatsApp</div>'
      : '<div style="color:#92611a; font-size:12px; font-weight:600; margin-top:6px">Not sent via WhatsApp (' +
        esc(wa.reason || 'unknown') + ') — copy &amp; paste below</div>';
    return '<div class="gen-output">' +
      '<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px">' +
        '<strong style="font-size:13px">Generated list (' + result.itemCount + ' items)</strong>' +
        '<button class="more-back" data-dismiss-gen="1" style="margin:0">Dismiss</button>' +
      '</div>' +
      '<textarea id="genText" readonly class="gen-text">' + esc(result.text) + '</textarea>' +
      '<button class="btn-primary" id="copyGenBtn" style="width:100%; padding:9px; font-size:13px; margin-top:8px">📋 Copy</button>' +
      waLine +
    '</div>';
  }

  async function copyGeneratedText_() {
    const ta = $('genText');
    if (!ta) return;
    try {
      await navigator.clipboard.writeText(ta.value);
      toast('Copied', 'success');
    } catch (e) {
      ta.select();
      try { document.execCommand('copy'); toast('Copied', 'success'); }
      catch (e2) { toast('Press and hold to copy', 'warning'); }
    }
  }

  async function generateShoppingList() {
    if (!confirm('Generate the to-buy list and (if configured) send it via WhatsApp?' +
                 ' The list stays as-is — items only leave when checked off or cleared.')) return;
    const btn = $('genListBtn');
    if (btn) { btn.disabled = true; btn.textContent = 'Generating…'; }
    try {
      const result = await call('rpcGenerateShoppingList', state.token);
      if (result.empty) {
        toast('Nothing to order', 'warning');
        if (btn) { btn.disabled = false; btn.textContent = 'Generate & send'; }
        return;
      }
      state.lastGenerated = result;
      toast(result.whatsapp && result.whatsapp.sent ? '✓ Generated & sent' : '✓ Generated', 'success');
      loadShoppingTab();
    } catch (e) {
      toast(e.message, 'error');
      if (btn) { btn.disabled = false; btn.textContent = 'Generate & send'; }
    }
  }

  // Product picker for the shopping list. ONE sheet that stays open: tapping
  // "+" adds the product at qty 1 straight away and turns the row into a
  // [− qty +] stepper, so a shopping run costs one tap per item instead of
  // three taps across two screens. Items can still ONLY be added by
  // referencing a product (product master is the single source of truth);
  // managers/admins keep the inline "Create new product" shortcut.
  //
  // Writes are optimistic + debounced: the row repaints immediately, the RPC
  // follows 600ms later, so hammering "+" to 5 collapses into a single write.
  async function openAddShoppingItem() {
    const privileged = ['admin', 'manager'].indexOf(state.me.role) >= 0;
    openSheet({
      title: 'Add items', subtitle: 'Tap + — the list updates as you go',
      bodyHTML: '<div class="loading"><div class="spinner"></div>Loading products…</div>',
      actionsHTML: '<button class="sheet-submit" onclick="closeSheet()">Done</button>',
    });
    let products = [];
    try { products = await cachedCall('rpcGetProductsForPicker', [state.token], TTL_REF); } catch (e) {}

    // productId -> { entryId, qty, note, timer, chain }
    // Seeded from the current list so steppers open showing real quantities.
    // Only rows this user may actually edit are seeded: rpcEdit/Remove reject
    // someone else's entry with FORBIDDEN unless you're a manager+. Anything
    // left unseeded just becomes a NEW row on tap — which is exactly what the
    // old add-flow did every time, so per-person attribution is preserved.
    // Legacy order_catalog rows carry no productId and are left alone.
    const canEditAny = ['manager', 'admin', 'payroll_admin'].indexOf(state.me.role) >= 0;
    const draft = {};
    (state.shoppingList || []).forEach(e => {
      if (!e.productId) return;
      if (!canEditAny && e.addedBy !== state.me.staffId) return;
      draft[e.productId] = {
        entryId: e.entryId, qty: Number(e.quantity) || 0,
        note: e.note || '', timer: null, chain: Promise.resolve(),
      };
    });
    let dirty = false;

    const CATS = ['all', 'vape', 'cigarettes', 'beer', 'grocery', 'other'];
    let activeCat = 'all';

    const bodyHTML =
      '<div class="sheet-field"><input type="text" id="siSearch" class="pm-search" placeholder="Search name / brand / SKU…" autocomplete="off"></div>' +
      '<div class="si-chips" id="siChips">' +
        CATS.map(c => '<button class="si-chip' + (c === 'all' ? ' on' : '') + '" data-cat="' + c + '">' +
          (c === 'all' ? 'All' : esc(catLabel(c))) + '</button>').join('') +
      '</div>' +
      (privileged ? '<button class="more-back" id="siNewProd" style="margin:0 0 8px">+ Create new product</button>' : '') +
      '<div id="siResults" class="si-results"></div>';
    openSheet({
      title: 'Add items', subtitle: 'Tap + — the list updates as you go', bodyHTML,
      actionsHTML: '<button class="sheet-submit" id="siDoneBtn">Done</button>',
    });

    function slot(pid) {
      const cells = $('siResults').querySelectorAll('[data-ctrl]');
      for (let i = 0; i < cells.length; i++) {
        if (cells[i].getAttribute('data-ctrl') === pid) return cells[i];
      }
      return null;
    }

    function ctrlHTML(pid) {
      const q = draft[pid] ? draft[pid].qty : 0;
      if (!q) return '<button class="si-add" data-add="' + esc(pid) + '" aria-label="Add">+</button>';
      return '<div class="si-step">' +
          '<button class="si-mn" data-dec="' + esc(pid) + '" aria-label="Reduce quantity">−</button>' +
          '<span class="si-q">' + q + '</span>' +
          '<button class="si-pl" data-inc="' + esc(pid) + '" aria-label="Increase quantity">+</button>' +
        '</div>';
    }

    // Push the local quantity to the server. Chained per product so an add
    // always resolves its entryId before a following edit/remove uses it.
    function flush(pid) {
      const d = draft[pid];
      if (!d) return Promise.resolve();
      clearTimeout(d.timer); d.timer = null;
      const target = d.qty;
      d.chain = d.chain.then(async () => {
        try {
          if (target > 0 && !d.entryId) {
            const res = await call('rpcAddToShoppingList', state.token,
              { productId: pid, quantity: target, note: d.note });
            d.entryId = res.entryId;
          } else if (target > 0) {
            await call('rpcEditShoppingListEntry', state.token, d.entryId,
              { quantity: target, note: d.note });
          } else if (d.entryId) {
            await call('rpcRemoveShoppingListEntry', state.token, d.entryId);
            d.entryId = null;
          }
          dirty = true;
        } catch (e) {
          // Don't guess at local state — resync from the server.
          toast(e.message, 'error');
          dirty = true;
        }
      });
      return d.chain;
    }

    function bump(pid, delta) {
      haptic();
      const d = draft[pid] || (draft[pid] =
        { entryId: null, qty: 0, note: '', timer: null, chain: Promise.resolve() });
      const next = Math.max(0, d.qty + delta);
      if (next === d.qty) return;
      d.qty = next;
      const cell = slot(pid);
      if (cell) cell.innerHTML = ctrlHTML(pid);   // repaint just this row
      clearTimeout(d.timer);
      d.timer = setTimeout(() => flush(pid), 600);
    }

    function renderResults() {
      const terms = ($('siSearch').value || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
      let list = products;
      if (activeCat !== 'all') list = list.filter(p => (p.category || 'other') === activeCat);
      if (terms.length) list = list.filter(p => {
        const hay = [p.sku, p.productName, p.brand, p.category, p.subcategory].join(' ').toLowerCase();
        return terms.every(t => hay.indexOf(t) >= 0);
      });
      list = list.slice(0, 40);
      if (!list.length) {
        $('siResults').innerHTML = '<div class="si-empty">No matching products.' +
          (privileged ? ' Use “+ Create new product”.' : ' Ask a manager to add it.') + '</div>';
        return;
      }
      $('siResults').innerHTML = list.map(p =>
        '<div class="si-row">' +
          '<div class="si-info">' +
            '<span class="si-name">' + esc(p.productName) + '</span>' +
            '<span class="si-meta">' + (p.brand ? esc(p.brand) + ' · ' : '') + esc(catLabel(p.category)) +
              (p.unit ? ' · ' + esc(p.unit) : '') + ' · cost ' + money(p.costPrice) + '</span>' +
          '</div>' +
          '<div class="si-ctrl" data-ctrl="' + esc(p.productId) + '">' + ctrlHTML(p.productId) + '</div>' +
        '</div>'
      ).join('');
    }

    // Delegated so repainting a single control never needs rebinding.
    $('siResults').onclick = (ev) => {
      const t = ev.target.closest('[data-add],[data-inc],[data-dec]');
      if (!t) return;
      const dec = t.getAttribute('data-dec');
      if (dec) return bump(dec, -1);
      bump(t.getAttribute('data-add') || t.getAttribute('data-inc'), 1);
    };

    $('siChips').onclick = (ev) => {
      const c = ev.target.closest('[data-cat]');
      if (!c) return;
      activeCat = c.getAttribute('data-cat');
      $('siChips').querySelectorAll('[data-cat]').forEach(b =>
        b.classList.toggle('on', b.getAttribute('data-cat') === activeCat));
      renderResults();
    };

    $('siSearch').oninput = renderResults;
    renderResults();

    if (privileged) {
      const np = $('siNewProd');
      if (np) np.onclick = () => openProductForm(null, {
        onSaved: async (created) => {
          // The new product isn't in the cached picker list yet — force a
          // refresh, then come back with it already on the list at qty 1.
          try { await cachedCall('rpcGetProductsForPicker', [state.token], TTL_REF, { force: true }); } catch (e) {}
          if (created && created.productId) {
            try {
              await call('rpcAddToShoppingList', state.token,
                { productId: created.productId, quantity: 1, note: '' });
              toast('✓ Added ' + (created.productName || 'product'), 'success');
            } catch (e) { toast(e.message, 'error'); }
            await loadShoppingTab(true);
          }
          openAddShoppingItem();
        },
      });
    }

    $('siDoneBtn').onclick = async () => {
      haptic();
      const btn = $('siDoneBtn');
      btn.disabled = true; btn.textContent = 'Saving…';
      // Fire anything still sitting in its debounce, then wait for every
      // in-flight write so the refreshed list can't race a pending add.
      const ids = Object.keys(draft);
      ids.forEach(pid => { if (draft[pid].timer) flush(pid); });
      try { await Promise.all(ids.map(pid => draft[pid].chain)); } catch (e) {}
      closeSheet();
      if (dirty) loadShoppingTab(true);
    };

    setTimeout(() => { const s = $('siSearch'); if (s) s.focus(); }, 60);
  }

  // Edit an entry's quantity / note (modal sheet). The item name comes from
  // the product master and is not editable here.
  function openEditShoppingItem(entry) {
    if (!entry) return;
    const bodyHTML =
      '<div class="si-pick"><div class="si-pick-name">' + esc(entry.itemName) + '</div>' +
        '<div class="si-pick-meta">' + esc(catLabel(entry.category)) +
          (entry.unit ? ' · ' + esc(entry.unit) : '') + '</div></div>' +
      '<div class="sheet-field"><label>Quantity</label><input type="number" step="0.01" id="seQty" inputmode="decimal"></div>' +
      '<div class="sheet-field"><label>Note (optional)</label><input type="text" id="seNote"></div>';
    openSheet({
      title: 'Edit item', subtitle: entry.itemName,
      bodyHTML,
      actionsHTML:
        '<button class="sheet-cancel" onclick="closeSheet()">Cancel</button>' +
        '<button class="sheet-submit" id="seSaveBtn">Save</button>',
    });
    $('seQty').value = entry.quantity;
    $('seNote').value = entry.note || '';

    $('seSaveBtn').onclick = async () => {
      const qty = parseFloat($('seQty').value);
      const note = $('seNote').value;
      if (!Number.isFinite(qty) || qty <= 0) return toast('Enter a valid quantity', 'error');
      haptic();
      const btn = $('seSaveBtn'); btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await call('rpcEditShoppingListEntry', state.token, entry.entryId, { quantity: qty, note });
        closeSheet();
        toast('✓ Saved', 'success');
        loadShoppingTab();
      } catch (e) { toast(e.message, 'error'); btn.disabled = false; btn.textContent = 'Save'; }
    };
  }

  // ============================================================
  //  ░░  TAB: PRODUCT MASTER  ░░
  // ============================================================
  const PRODUCT_CATEGORIES_UI = ['vape', 'cigarettes', 'beer', 'grocery', 'other'];

  const PM_SORTS = {
    name_asc:    { label: 'Name (A–Z)',        cmp: (a, b) => (a.productName || '').localeCompare(b.productName || '') },
    margin_desc: { label: 'Margin % (high→low)', cmp: (a, b) => (b.marginPct || 0) - (a.marginPct || 0) },
    sell_desc:   { label: 'Sell $ (high→low)',  cmp: (a, b) => (b.sellPrice || 0) - (a.sellPrice || 0) },
    sell_asc:    { label: 'Sell $ (low→high)',  cmp: (a, b) => (a.sellPrice || 0) - (b.sellPrice || 0) },
  };

  function pmDefaultFilter() {
    return { query: '', category: '', brand: '', supplier: '', sort: 'name_asc' };
  }

  // Distinct non-blank values for a field, scoped to records that match `categoryFilter`.
  function pmDistinct(records, field, categoryFilter) {
    const inScope = categoryFilter ? records.filter(r => r.category === categoryFilter) : records;
    const set = new Set();
    inScope.forEach(r => {
      const v = (r[field] || '').toString().trim();
      if (v) set.add(v);
    });
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }

  async function loadProductsTab(force) {
    const view = $('view-products');
    if (force || !cacheFresh('rpcGetProductMaster', [state.token, {}], TTL_REF)) {
      view.innerHTML = '<div class="loading"><div class="spinner"></div>Loading products…</div>';
    }
    try {
      const products = await cachedCall('rpcGetProductMaster', [state.token, {}], TTL_REF, { force });
      state.products = products || [];
      if (!state.productsFilter) state.productsFilter = pmDefaultFilter();
      renderProductsTab();
    } catch (e) {
      handleRpcError(e, view);
    }
  }

  function renderProductsTab() {
    const view = $('view-products');
    const products = state.products || [];
    if (!state.productsFilter) state.productsFilter = pmDefaultFilter();
    const filter = state.productsFilter;
    const privileged = state.me && (state.me.role === 'admin' || state.me.role === 'manager');

    // Capture focus + caret position so re-render doesn't kill an active
    // <input> (the search box loses focus after every keystroke otherwise).
    const activeEl = document.activeElement;
    const activeId = activeEl && activeEl.id;
    let savedSelStart = 0, savedSelEnd = 0;
    if (activeEl && activeEl.tagName === 'INPUT' && typeof activeEl.selectionStart === 'number') {
      savedSelStart = activeEl.selectionStart;
      savedSelEnd = activeEl.selectionEnd;
    }

    // Brand + supplier dropdowns are scoped to the active category — keeps
    // them from listing values that can't match anyway.
    const brandOptions = pmDistinct(products, 'brand', filter.category);
    const supplierOptions = pmDistinct(products, 'supplier', filter.category);

    // Auto-clear stale selections that aren't in the current option set
    // (e.g. category change invalidated the brand filter).
    if (filter.brand && brandOptions.indexOf(filter.brand) === -1) filter.brand = '';
    if (filter.supplier && supplierOptions.indexOf(filter.supplier) === -1) filter.supplier = '';

    const terms = (filter.query || '').toLowerCase().trim().split(/\s+/).filter(Boolean);
    const visible = products.filter(p => {
      if (filter.category && p.category !== filter.category) return false;
      if (filter.brand && p.brand !== filter.brand) return false;
      if (filter.supplier && p.supplier !== filter.supplier) return false;
      if (terms.length === 0) return true;
      const hay = [p.sku, p.productName, p.brand, p.category, p.subcategory].join(' ').toLowerCase();
      return terms.every(t => hay.indexOf(t) >= 0);
    });

    const sorter = (PM_SORTS[filter.sort] || PM_SORTS.name_asc).cmp;
    visible.sort(sorter);

    const activeFilterCount =
      (filter.category ? 1 : 0) +
      (filter.brand ? 1 : 0) +
      (filter.supplier ? 1 : 0) +
      (filter.query ? 1 : 0);

    let html = moreBack();
    html += '<div class="products-controls">' +
      '<input id="pmSearch" class="pm-search" placeholder="Search SKU / name / brand…" value="' + esc(filter.query) + '" autocomplete="off">' +
      (privileged ? '<button class="btn-primary" id="pmAddBtn">+ Add</button>' : '') +
    '</div>';

    html += '<div class="products-filter-row">' +
      '<select id="pmCat" title="Category">' +
        '<option value="">All categories</option>' +
        PRODUCT_CATEGORIES_UI.map(c =>
          '<option value="' + c + '"' + (filter.category === c ? ' selected' : '') + '>' + c + '</option>'
        ).join('') +
      '</select>' +
      '<select id="pmBrand" title="Brand"' + (brandOptions.length === 0 ? ' disabled' : '') + '>' +
        '<option value="">All brands' + (brandOptions.length ? ' (' + brandOptions.length + ')' : '') + '</option>' +
        brandOptions.map(b =>
          '<option value="' + esc(b) + '"' + (filter.brand === b ? ' selected' : '') + '>' + esc(b) + '</option>'
        ).join('') +
      '</select>' +
      '<select id="pmSupplier" title="Supplier"' + (supplierOptions.length === 0 ? ' disabled' : '') + '>' +
        '<option value="">All suppliers' + (supplierOptions.length ? ' (' + supplierOptions.length + ')' : '') + '</option>' +
        supplierOptions.map(s =>
          '<option value="' + esc(s) + '"' + (filter.supplier === s ? ' selected' : '') + '>' + esc(s) + '</option>'
        ).join('') +
      '</select>' +
      '<select id="pmSort" title="Sort">' +
        Object.keys(PM_SORTS).map(k =>
          '<option value="' + k + '"' + (filter.sort === k ? ' selected' : '') + '>' + esc(PM_SORTS[k].label) + '</option>'
        ).join('') +
      '</select>' +
      (activeFilterCount > 0 ? '<button class="pm-clear" id="pmClearFilters">Clear</button>' : '') +
    '</div>';

    html += '<div class="mypay-section-title">' + visible.length + ' product' + (visible.length === 1 ? '' : 's') +
      (visible.length > 200 ? ' — showing first 200; refine search' : '') + '</div>';

    visible.slice(0, 200).forEach(p => {
      // Floor flag: sell < min, with $0.005 tolerance to avoid false flags from rounding.
      const belowMin = (p.minSellPrice > 0 && p.sellPrice > 0 &&
                       (p.sellPrice + 0.005) < p.minSellPrice);
      const flagBadge = belowMin
        ? ' <span class="badge-warn" title="Sell price is below the min sell floor">⚠ below min</span>'
        : '';
      const marginPctStr = p.sellPrice > 0
        ? (Math.round(p.marginPct * 1000) / 10).toFixed(1) + '%'
        : '—';
      html += '<div class="payroll-card">' +
        '<div class="product-row-head">' +
          '<div style="min-width:0; flex:1">' +
            '<div class="payroll-name" style="overflow:hidden; text-overflow:ellipsis">' +
              esc(p.productName) + flagBadge +
            '</div>' +
            '<div class="product-row-meta">' +
              (p.brand ? esc(p.brand) + ' · ' : '') +
              esc(p.category) +
              (p.sku ? ' · SKU ' + esc(p.sku) : '') +
            '</div>' +
          '</div>' +
          '<div class="product-row-margin">' +
            money(p.sellPrice) +
            '<div class="product-row-meta">cost ' + money(p.costPrice) + ' · margin ' + marginPctStr + '</div>' +
          '</div>' +
        '</div>' +
        (privileged
          ? '<div class="payroll-actions">' +
              '<button class="payroll-btn payroll-btn-secondary" data-edit-product="' + esc(p.productId) + '">Edit</button>' +
              (p.active
                ? '<button class="payroll-btn" data-deactivate-product="' + esc(p.productId) + '">Deactivate</button>'
                : '<span class="badge-inactive">Inactive</span>')
            + '</div>'
          : '') +
      '</div>';
    });

    view.innerHTML = html;

    // Restore focus + caret on the element that was active before innerHTML
    // (search input is the one that hurts; this generalizes to any input).
    if (activeId) {
      const restored = $(activeId);
      if (restored) {
        restored.focus();
        if (restored.tagName === 'INPUT' && typeof restored.setSelectionRange === 'function') {
          try { restored.setSelectionRange(savedSelStart, savedSelEnd); } catch (e) { /* type may not support */ }
        }
      }
    }

    // Wire controls
    const searchEl = $('pmSearch');
    if (searchEl) {
      searchEl.oninput = (e) => { state.productsFilter.query = e.target.value; renderProductsTab(); };
    }
    const catEl = $('pmCat');
    if (catEl) {
      catEl.onchange = (e) => {
        state.productsFilter.category = e.target.value;
        // brand/supplier auto-clear (if stale) happens inside renderProductsTab
        renderProductsTab();
      };
    }
    const brandEl = $('pmBrand');
    if (brandEl) {
      brandEl.onchange = (e) => { state.productsFilter.brand = e.target.value; renderProductsTab(); };
    }
    const supplierEl = $('pmSupplier');
    if (supplierEl) {
      supplierEl.onchange = (e) => { state.productsFilter.supplier = e.target.value; renderProductsTab(); };
    }
    const sortEl = $('pmSort');
    if (sortEl) {
      sortEl.onchange = (e) => { state.productsFilter.sort = e.target.value; renderProductsTab(); };
    }
    const clearEl = $('pmClearFilters');
    if (clearEl) {
      clearEl.onclick = () => {
        state.productsFilter = pmDefaultFilter();
        renderProductsTab();
      };
    }
    if (privileged) {
      const addBtn = $('pmAddBtn');
      if (addBtn) addBtn.onclick = () => openProductForm(null);
      view.querySelectorAll('[data-edit-product]').forEach(b => {
        b.onclick = () => openProductForm(products.find(p => p.productId === b.dataset.editProduct));
      });
      view.querySelectorAll('[data-deactivate-product]').forEach(b => {
        b.onclick = () => deactivateProduct(b.dataset.deactivateProduct);
      });
    }
  }

  // Form descriptors per category (which detail fields to render, whether
  // core cost/sell are editable). Cached so switching category is instant.
  async function fetchPmSchema(category) {
    if (!state.pmSchemaCache) state.pmSchemaCache = {};
    if (state.pmSchemaCache[category]) return state.pmSchemaCache[category];
    const sc = await call('rpcGetProductTypeSchema', state.token, category);
    state.pmSchemaCache[category] = sc;
    return sc;
  }

        '<input type="text" id="pmSupplier" value="' + esc(initial.supplier) + '"></div>' +

      '<div class="sheet-field"><label>Notes (optional)</label>' +
        '<input type="text" id="pmNotes" value="' + esc(initial.notes) + '"></div>' +

      '<div id="pmMarginPreview" class="product-margin-preview">' +
        '<span>Margin</span>' +
        '<span><span id="pmMarginAmt">$0.00</span> <span class="meta" id="pmMarginPct">(0.0%)</span></span>' +
      '</div>';

    const actionsHTML =
      '<button class="sheet-cancel" onclick="closeSheet()">Cancel</button>' +
      '<button class="sheet-submit" id="pmSaveBtn">' + (isEdit ? 'Save changes' : 'Create product') + '</button>';

    openSheet({
      title: isEdit ? 'Edit product' : 'New product',
      subtitle: isEdit ? 'SKU is locked on edit' : 'Cost, sell, margin & floor',
      bodyHTML,
      actionsHTML,
    });

    function updateMarginPreview() {
      const cost = parseFloat($('pmCost').value) || 0;
      const sell = parseFloat($('pmSell').value) || 0;
      const minSell = parseFloat($('pmMinSell').value) || 0;
      const amt = Math.round((sell - cost) * 100) / 100;
      const pct = sell > 0 ? ((sell - cost) / sell) * 100 : 0;
      const belowMin = (minSell > 0 && sell > 0 && (sell + 0.005) < minSell);
      $('pmMarginAmt').textContent = money(amt);
      $('pmMarginPct').textContent = '(' + pct.toFixed(1) + '%)' + (belowMin ? ' — sell below min floor!' : '');
      $('pmMarginPreview').classList.toggle('bad', belowMin || amt < 0);
    }

    const round2 = (v) => Math.round((Number(v) || 0) * 100) / 100;

    // Read the dynamic detail inputs into a snake_case object. Percent
    // fields are shown as 0–100 but stored as 0..1 (matching the server).
    function readDetailInputs(schema) {
      const d = {};
      (schema.detailFields || []).forEach(f => {
        const el = $('pmd_' + f.key);
        if (!el) return;
        if (f.type === 'percent') { const v = parseFloat(el.value); d[f.key] = isNaN(v) ? 0 : v / 100; }
        else if (f.type === 'number') { const v = parseFloat(el.value); d[f.key] = isNaN(v) ? 0 : v; }
        else d[f.key] = el.value.trim();
      });
      return d;
    }

    // Client mirror of ProductTypes.derivePricing — PREVIEW ONLY; the server
    // is the source of truth on save. Margin inputs (d.*_pct) are 0..1.
    function deriveClient(cat, d) {
      if (cat === 'beer') {
        let cost = d.cost_input || 0;
        if (cost <= 0 && d.lcbo_case_price > 0 && d.units_per_case > 0) cost = d.lcbo_case_price / d.units_per_case;
        const m = d.target_margin_pct || 0;
        const base = (m > 0 && m < 1) ? cost / (1 - m) : cost;
        const sell = round2(base + (d.deposit_per_unit || 0));
        return { cost: round2(cost), sell: sell, credit: sell };
      }
      if (cat === 'cigarettes') {
        const packs = d.packs_per_carton || 0;
        const costPerPack = packs > 0 ? (d.cost_per_carton || 0) / packs : 0;
        const m = d.target_margin_pct || 0;
        const sell = (m > 0 && m < 1) ? costPerPack / (1 - m) : costPerPack;
        return { cost: round2(costPerPack), sell: round2(sell), credit: round2(sell) };
      }
      if (cat === 'vape') {
        const sell = round2(d.sale_price || 0);
        const credit = d.sale_price_credit ? round2(d.sale_price_credit) : sell;
        return { cost: round2(d.purchase_price || 0), sell: sell, credit: credit };
      }
      return null;   // grocery / other: cost & sell entered directly
    }

    function recompute() {
      const schema = currentSchema;
      if (!schema.costEditable || !schema.sellEditable) {
        const r = deriveClient(schema.category, readDetailInputs(schema));
        if (r) {
          if (!schema.costEditable) $('pmCost').value = r.cost ? r.cost.toFixed(2) : '';
          if (!schema.sellEditable) {
            $('pmSell').value = r.sell ? r.sell.toFixed(2) : '';
            $('pmSellCredit').value = r.credit ? r.credit.toFixed(2) : '';
          }
        }
      }
      updateMarginPreview();
    }

    function typeTitle(cat) {
      return cat === 'beer' ? '🍺 Beer pricing (LCBO case model)'
           : cat === 'cigarettes' ? '🚬 Cigarette pricing (carton → pack)'
           : cat === 'vape' ? '💨 Vape attributes & pricing'
           : '';
    }

    function renderDetailBlock(schema, dv) {
      const fields = schema.detailFields || [];
      if (!fields.length) return '';
      let h = '<div class="sheet-field" style="background:#f5f7ff;border:1px solid #d8def0;border-radius:6px;padding:8px">' +
        '<div style="font-size:11px;font-weight:600;color:#283593;margin-bottom:6px">' + esc(typeTitle(schema.category)) + '</div>' +
        '<div style="display:flex;flex-wrap:wrap;gap:8px">';
      fields.forEach(f => {
        let val = dv ? dv[f.key] : '';
        if (f.type === 'percent' && val !== '' && val != null) val = Number(val) * 100;
        const inputType = (f.type === 'number' || f.type === 'percent') ? 'number' : 'text';
        const step = f.step ? ' step="' + esc(f.step) + '"' : (f.type === 'percent' ? ' step="0.1"' : '');
        const label = f.label + (f.type === 'percent' ? ' %' : '');
        h += '<div style="flex:1 1 45%;min-width:120px"><label>' + esc(label) + '</label>' +
          '<input id="pmd_' + esc(f.key) + '" type="' + inputType + '"' + step +
          (f.placeholder ? ' placeholder="' + esc(f.placeholder) + '"' : '') +
          ' value="' + esc(val == null || val === '' ? '' : String(val)) + '"></div>';
      });
      h += '</div></div>';
      return h;
    }

    function applySchema(schema, detailValues) {
      currentSchema = schema;
      $('pmDetailBlock').innerHTML = renderDetailBlock(schema, detailValues);
      $('pmCost').readOnly = !schema.costEditable;
      $('pmSell').readOnly = !schema.sellEditable;
      $('pmSellCredit').readOnly = !schema.sellEditable;
      $('pmSellHint').style.display = schema.sellEditable ? 'none' : '';
      $('pmCostLabel').textContent = schema.costEditable ? 'Cost $' : 'Cost $ (auto)';
      $('pmSellLabel').textContent = schema.sellEditable ? 'Sell $' : 'Sell $ (auto)';
      (schema.detailFields || []).forEach(f => {
        const el = $('pmd_' + f.key);
        if (el) el.oninput = recompute;
      });
      recompute();
    }

    ['pmCost', 'pmSell', 'pmSellCredit', 'pmMinSell'].forEach(id => {
      const el = $(id); if (el) el.oninput = updateMarginPreview;
    });

    $('pmCategory').onchange = async () => {
      const cat = $('pmCategory').value;
      let schema;
      try { schema = await fetchPmSchema(cat); }
      catch (e) { toast('Could not load ' + cat + ' fields', 'error'); return; }
      applySchema(schema, {});   // reset detail inputs on a type switch
    };

    applySchema(currentSchema, initialDetail);

    $('pmSaveBtn').onclick = async () => {
      const productName = $('pmName').value.trim();
      if (!productName) { toast('Product name is required', 'error'); return; }
      const category = $('pmCategory').value;
      const schema = currentSchema;
      const payload = {
        productName: productName,
        brand:        $('pmBrand').value.trim(),
        category:     category,
        subcategory:  $('pmSubcategory').value.trim(),
        packSize:     $('pmPackSize').value.trim(),
        unit:         $('pmUnit').value.trim(),
        supplier:     $('pmSupplier').value.trim(),
        notes:        $('pmNotes').value.trim(),
        minSellPrice: parseFloat($('pmMinSell').value) || 0,
        detail:       readDetailInputs(schema),
      };
      if (schema.costEditable) payload.costPrice = parseFloat($('pmCost').value) || 0;
      if (schema.sellEditable) {
        payload.sellPrice = parseFloat($('pmSell').value) || 0;
        payload.sellPriceCredit = parseFloat($('pmSellCredit').value) || 0;
      }

      $('pmSaveBtn').disabled = true;
      try {
        if (isEdit) {
          await call('rpcUpdateProduct', state.token, p.productId, payload);
          toast('Saved', 'success');
          closeSheet();
          loadProductsTab(true);
        } else {
          payload.sku = $('pmSku').value.trim();
          const created = await call('rpcCreateProduct', state.token, payload);
          toast('Created', 'success');
          // Hand the new product to a caller (e.g. the shopping-list add flow)
          // instead of the default close + product-tab reload.
          if (opts.onSaved) { opts.onSaved(created); return; }
          closeSheet();
          loadProductsTab(true);
        }
      } catch (e) {
        $('pmSaveBtn').disabled = false;
        toast(e.message || 'Save failed', 'error');
      }
    };
  }

  async function deactivateProduct(productId) {
    if (!confirm('Deactivate this product? It stays in the data (soft-delete) but won\'t appear in the active list.')) return;
    try {
      await call('rpcDeactivateProduct', state.token, productId);
      toast('Deactivated', 'warning');
      loadProductsTab(true);
    } catch (e) {
      toast(e.message || 'Deactivate failed', 'error');
    }
  }

  //  ░░  TAB: PAYROLL  ░░

  async function loadPayrollTab(force) {
    const view = $('view-payroll');
    if (force || !cacheFresh('rpcGetPayrollOverview', [state.token], TTL_SEMI)) {
      view.innerHTML = '<div class="loading"><div class="spinner"></div>Loading payroll…</div>';
    }
    try {
      const overview = await cachedCall('rpcGetPayrollOverview', [state.token], TTL_SEMI, { force });
      renderPayrollTab(overview);
    } catch (e) {
      handleRpcError(e, view);
    }
